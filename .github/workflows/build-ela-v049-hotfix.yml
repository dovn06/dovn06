name: Build ELA v0.4.9.1 Auth Hotfix

on:
  push:
    branches:
      - artifact/ela-v049-auth-patch
    paths:
      - 'ela-v049-hotfix/**'
      - '.github/workflows/build-ela-v049-hotfix.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ela-v049-hotfix/**'
      - '.github/workflows/build-ela-v049-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Node runtime syntax
        run: node --check ela-v049-hotfix/patch/apps/web/server.mjs

      - name: Check mock API syntax
        run: node --check ela-v049-hotfix/tests/mock-api.mjs

      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $content = Get-Content 'ela-v049-hotfix/scripts/Apply-V049-AuthHotfix.ps1' -Raw
          [void][scriptblock]::Create($content)
          Write-Host 'PowerShell parse: PASS'

      - name: Regression - auto find sibling project and accept spaces
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'ELA English Path Test'
          $hotfix = Join-Path $base 'R10\v049-hotfix'
          $project = Join-Path $base 'R9\EnglishLearningApp M4 v048'
          New-Item -ItemType Directory -Force -Path (Join-Path $hotfix 'scripts') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $project 'apps\web') | Out-Null
          Copy-Item 'ela-v049-hotfix/scripts/Apply-V049-AuthHotfix.ps1' (Join-Path $hotfix 'scripts\Apply-V049-AuthHotfix.ps1') -Force
          Set-Content (Join-Path $project 'docker-compose.yml') 'services: {}'
          Set-Content (Join-Path $project 'package.json') '{"name":"ela-path-test"}'
          Set-Content (Join-Path $project 'apps\web\server.mjs') 'console.log("test")'
          Push-Location $hotfix
          try {
            $output = & pwsh -NoProfile -File (Join-Path $hotfix 'scripts\Apply-V049-AuthHotfix.ps1') -DiscoveryOnly 2>&1 | Out-String
          } finally {
            Pop-Location
          }
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "DiscoveryOnly failed with exit code $LASTEXITCODE" }
          if (-not $output.Contains("DISCOVERED_PROJECT_ROOT=$project")) {
            throw "Sibling project was not auto-discovered. Expected: $project"
          }
          Write-Host 'Sibling path discovery: PASS'

      - name: Regression - explicit project path and quoted path
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'ELA Explicit Path Test'
          $project = Join-Path $base 'EnglishLearningApp Project'
          New-Item -ItemType Directory -Force -Path (Join-Path $project 'apps\web') | Out-Null
          Set-Content (Join-Path $project 'docker-compose.yml') 'services: {}'
          Set-Content (Join-Path $project 'package.json') '{"name":"ela-explicit-test"}'
          Set-Content (Join-Path $project 'apps\web\server.mjs') 'console.log("test")'
          $quoted = '"' + $project + '"'
          $output = & pwsh -NoProfile -File 'ela-v049-hotfix/scripts/Apply-V049-AuthHotfix.ps1' -ProjectRoot $quoted -DiscoveryOnly 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "Explicit discovery failed with exit code $LASTEXITCODE" }
          if (-not $output.Contains("DISCOVERED_PROJECT_ROOT=$project")) { throw 'Quoted explicit path was not accepted' }
          Write-Host 'Explicit/quoted path discovery: PASS'

      - name: Enforce volume preservation
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '^[[:space:]]*docker(\.exe)?[[:space:]]+compose.*down[[:space:]]+-v|^[[:space:]]*docker[[:space:]]+volume[[:space:]]+rm|^[[:space:]]*docker-compose.*down[[:space:]]+-v' \
            ela-v049-hotfix \
            --include='*.ps1' --include='*.bat' --include='*.cmd' --include='*.sh'; then
            echo 'Destructive volume command found' >&2
            exit 1
          fi
          echo 'Volume preservation scan: PASS'

      - name: Run auth gateway regression
        shell: bash
        run: bash ela-v049-hotfix/tests/run-auth-gateway-regression.sh

      - name: Check no secrets are packaged
        shell: bash
        run: |
          set -euo pipefail
          test ! -f ela-v049-hotfix/.env
          if grep -R -E '(JWT_SECRET=|DATABASE_URL=postgresql://[^<]|DEMO_PASSWORD=)' ela-v049-hotfix --exclude='README.md'; then
            echo 'Potential runtime secret found' >&2
            exit 1
          fi
          echo 'Secret scan: PASS'

      - name: Build ZIP and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp -a ela-v049-hotfix/. dist/package/
          rm -rf dist/package/tests dist/package/logs
          (
            cd dist/package
            zip -r ../EnglishLearningApp_v0.4.9.1_AuthHotfix_PathFix.zip .
          )
          (
            cd dist
            sha256sum EnglishLearningApp_v0.4.9.1_AuthHotfix_PathFix.zip > EnglishLearningApp_v0.4.9.1_AuthHotfix_PathFix.sha256
          )
          unzip -tq dist/EnglishLearningApp_v0.4.9.1_AuthHotfix_PathFix.zip
          cat dist/EnglishLearningApp_v0.4.9.1_AuthHotfix_PathFix.sha256

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: EnglishLearningApp_v0.4.9.1_AuthHotfix_PathFix
          path: |
            dist/EnglishLearningApp_v0.4.9.1_AuthHotfix_PathFix.zip
            dist/EnglishLearningApp_v0.4.9.1_AuthHotfix_PathFix.sha256
          if-no-files-found: error
          retention-days: 30
